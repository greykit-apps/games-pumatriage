          if (!p.isBot) { G.actor = p.id; return WAIT; }
          const mv = botCityStep(p);
          const took = cityEnter(p, mv);
          return animate([{ type: "render" }, { type: "sfx", name: took ? "place" : "deal" }, { type: "wait", delay: 320, min: 90 }]);
        }
        const refilled = cityFinish(p);
        if (p.keepPending && !p.isBot) { G.actor = p.id; return WAIT; }
        if (refilled) return animate([{ type: "render" }, { type: "sfx", name: "roll" }, { type: "fx", sel: "#table .ctile .die", cls: "rolling" }, { type: "wait", delay: 450, min: 120 }]);
        return NEXT;
      }
      go("intake", "cityOrder"); return NEXT;
    },
    cityOrder() {
      // Priority Lane tokens come off before the totals are read.
      for (const p of playersInTurnOrder()) {
        if (p.laneDone) continue;
        if (!p.tokens.includes("lane")) { p.laneDone = true; continue; }
        if (p.isBot) { while (p.tokens.includes("lane") && botLaneWorth(p)) useLane(p); p.laneDone = true; continue; }
        G.actor = p.id; return WAIT;
      }
      applyCityOrder();
      if (G.cfg.epidemic) for (const p of G.players) { const d = drawDieFromBag(); if (d) { d.value = rollValue(); p.pendingDice.push(d); } }
      G.cursor = 0;
      go("intake", "place");
      return animate([{ type: "render" }, { type: "wait", delay: 500, min: 150 }]);
    },
    keep() {
      const p = human();
      if (p.pendingDice.length > 3 && !p.keptThisRound) { G.actor = 0; return WAIT; }
      // (solo only; Virtualization is not offered in solo)
      p.keptThisRound = false;
      G.cursor = 0;
      go("intake", "place"); return NEXT;
    },
    pick() {
      const n = G.players.length;
      while (G.cursor < n) {
        const p = G.players[(G.firstPlayer + G.cursor) % n];
        if (p.ambulance !== null) { G.cursor++; continue; }
        if (p.isBot) {
          applyPickAmbulance(p, botPickAmbulance(p));
          // One rival at a time, so each claim stamp lands on its own.
          if (!UI.headless && !UI.reducedMotion) return animate([{ type: "render" }, { type: "sfx", name: "place" }, { type: "wait", delay: 500, min: 180 }]);
          continue;
        }
        G.actor = p.id; return WAIT;
      }
      // Everyone has a queue. Leftover dice go back in the bag; lowest queue = intel token + Incident Commander.
      for (const a of G.ambulances) if (a.takenBy === null) { for (const d of a.dice) returnToBag(d); a.dice = []; }
      G.turnOrder = G.players.slice().sort((a, b) => a.ambulance - b.ambulance).map(p => p.id);
      const lowest = playersInTurnOrder()[0];
      lowest.bloodBags++;
      if (G.firstPlayer !== lowest.id) log(`${lowest.name} took the lowest queue: +1 intel token and the Incident Commander role.`);
      else log(`${lowest.name} took the lowest queue: +1 intel token, stays Incident Commander.`);
      G.firstPlayer = lowest.id;
      for (const p of G.players) {
        const a = G.ambulances.find(x => x.num === p.ambulance);
        if (!a) continue;
        for (const d of a.dice) {
          // A fifth hypervisor cannot be taken: it goes back to the supply and
          // a coloured host from the bag, set to the same value, comes instead.
          if (isMother(d) && mothersOf(p).length + p.pendingDice.filter(isMother).length >= MAT.maxMothers) {
            G.supply.mother++;
            const sub = drawDieFromBag();
            if (sub) { sub.value = d.value; p.pendingDice.push(sub); }
            log(`${p.name}: already running ${MAT.maxMothers} hypervisors; a ${sub ? sub.colour : "no"} host at ${d.value} comes instead.`, "warn");
          } else p.pendingDice.push(d);
        }
        a.dice = [];
      }
      G.cursor = 0;
      go("intake", "place"); return NEXT;
    },
    place() {
      for (const p of playersInTurnOrder()) {
        if (!p.pendingDice.length && !p.twinsPending) continue;
        let free = emptyBeds(p).length;
        if (p.pendingDice.length > free) {
          // Pink hosts are never written off, so the shortage is capped by what can be.
          const removable = boardDice(p).filter(d => !isPink(d) && findBed(p, d.uid)).length;
          const shortage = Math.min(p.pendingDice.length - free, removable);
          if (shortage > 0) {
            if (p.isBot) { for (const uid of botChooseFatalities(p, shortage)) { const d = findDie(p, uid); if (d) fatality(p, d, null); } log(`${p.name} ran out of quarantine space: ${shortage} ${plural(shortage, "breach", "breaches")}.`, "bad"); }
            else { G.overflow = { pid: p.id, shortage, marked: [] }; G.actor = 0; return WAIT; }
          }
          free = emptyBeds(p).length;
          if (p.pendingDice.length > free) {
            // Still no bed for some incoming hosts (only pink hosts left to write off): they go back.
            p.pendingDice.sort((a, b) => (isMother(b) ? 1 : 0) - (isMother(a) ? 1 : 0));
            const extra = p.pendingDice.splice(free);
            for (const d of extra) { if (isPink(d)) G.supply.mother++; else returnToBag(d); }
            log(`${p.name}: no room for ${extra.length} incoming ${plural(extra.length, "host")}; ${extra.length === 1 ? "it goes" : "they go"} back.`, "warn");
          }
        }
        if (G.cfg.maternity) {
          // Where a host goes now matters: hypervisors degrade only in company.
          if (p.isBot) { botPlaceDice(p); continue; }
          G.actor = 0; return WAIT;
        }
        const n = p.pendingDice.length;
        for (const d of p.pendingDice) placeDie(p, d);
        p.pendingDice = [];
        if (!p.isBot) log(`${n} new ${plural(n, "host")} admitted to quarantine.`, "sys");
      }
      const ev = currentEvent();
      G.cursor = 0;
      if (ev && ev.skipImprove) { log(`${ev.name}: no improvements this shift.`, "warn"); go("activate", "start"); }
      else go("improve", "take");
      return animate([{ type: "render" }, { type: "sfx", name: "place" }, { type: "wait", delay: 350 }]);
    },
  },
  improve: {
    take() {
      // Freshly drawn cards deal onto the table before anyone picks.
      if (!G.dealt) {
        G.dealt = true;
        const n = G.deptDisplay.filter(Boolean).length + G.specDisplay.filter(Boolean).length;
        // Deal, then leave the whole display on the table long enough to read.
        UI.quickPicks = false;
        if (n) return animate([{ type: "render" }, { type: "sfx", name: "deal" }, { type: "fx", sel: "#display .disp-row > *", cls: "dealt", stagger: 68 }, { type: "wait", delay: 68 * n + 285 + 750, min: 68 * n + 375 }]);
      }
      // Your own pick gets its beat too: the card flies to your board, leaving
      // its slot open, before any rival moves.
      if (UI.takeFrom && !UI.headless && !UI.reducedMotion) return animate([{ type: "render" }, { type: "wait", delay: 420 }]);
      if (G.cfg.solo) {
        const p = human();
        if (p.took) { go("improve", "return"); return NEXT; }
        if (!G.deptDisplay.length && !G.specDisplay.length) {
          if (G.deptStack.length) G.deptDisplay = [G.deptStack.pop()];
          if (G.specStack.length) G.specDisplay = [G.specStack.pop()];
          if (G.deptDisplay.length || G.specDisplay.length) { G.dealt = false; return NEXT; }
        }
        if (!G.deptDisplay.filter(Boolean).length && !G.specDisplay.filter(Boolean).length) { p.took = true; go("improve", "return"); return NEXT; }
        G.actor = 0; return WAIT;
      }
      for (const p of playersInTurnOrder()) {
        if (p.took) continue;
        if (!G.deptDisplay.filter(Boolean).length && !G.specDisplay.filter(Boolean).length) { p.took = true; continue; }
        if (p.isBot) {
          const paced = !UI.headless && !UI.reducedMotion;
          // One rival at a time, in three beats: the rival's choice is
          // highlighted on the table, then that card slides off toward its
          // panel card, then a breath with its slot standing empty (the last
          // render swaps the faded card for the gap; nothing else moves).
          if (paced && !(UI.choosing && UI.choosing.pid === p.id)) {
            const c = botPickImprovement(p);
            if (!c) { p.took = true; continue; }
            UI.choosing = { kind: c.kind, idx: c.idx, pid: p.id, name: p.name };
            // Once you have picked, the rest no longer bears on you: rivals go at a clip.
            UI.quickPicks = !!human().took;
            return animate([{ type: "render" }, { type: "wait", delay: UI.quickPicks ? 200 : 525, min: UI.quickPicks ? 110 : 210 }]);
          }
          const c = paced ? UI.choosing : botPickImprovement(p);
          UI.choosing = null;
          if (!c) { p.took = true; continue; }
          const item = c.kind === "dept" ? G.deptDisplay[c.idx] : G.specDisplay[c.idx];
          applyTake(p, c.kind, c.idx);
          if (paced) {
            UI.leaving = { kind: c.kind, idx: c.idx, item, pid: p.id, name: p.name };
            const q = UI.quickPicks;
            return animate([{ type: "render" }, { type: "sfx", name: "place" }, { type: "wait", delay: q ? 260 : 525, min: q ? 150 : 240 }, { type: "render" }, { type: "wait", delay: q ? 100 : 220, min: q ? 60 : 120 }]);
          }
          continue;
        }
        G.actor = p.id; return WAIT;
      }
      go("improve", "invest"); return NEXT;
    },
    // Procurement: in response order, one staff member may spend the shift at
    // the desk for an upgrade.
    invest() {
      if (!G.cfg.invest) { go("improve", "return"); return NEXT; }
      for (const p of playersInTurnOrder()) {
        if (p.invested) continue;
        if (p.isBot) {
          const did = botInvest(p); p.invested = true;
          if (did) return animate([{ type: "render" }, { type: "sfx", name: "place" }, { type: "wait", delay: 450, min: 150 }]);
          continue;
        }
        G.actor = p.id; return WAIT;
      }
      G.invest = null;
      go("improve", "return"); return NEXT;
    },
    return() {
      // The rulebook's "return one improvement for a blood bag" is offered to the
      // human at the top of activation instead of as its own stop: nothing
      // happens between the two points, and it saves a click every shift.
      for (const p of playersInTurnOrder()) {
        if (p.returnDone) continue;
        if (p.isBot) { const r = botReturnDecision(p); applyReturn(p, r ? r.kind : null, r ? r.uid : null); continue; }
        p.returnDone = true; p.returnOpen = true;
      }
      go("activate", "start"); return NEXT;
    },
  },
  activate: {
    start() {
      const ev = currentEvent();
      if (ev && !G.eventApplied) {
        G.eventApplied = true;
        for (const p of G.players) {
          if (ev.intelAll) p.bloodBags++;
          if (ev.staffShortage) { const m = p.meeples.find(x => x.kind === "nurse" && !x.off); if (m) m.off = true; }
          if (ev.autoHeal) { const ds = boardDice(p).sort((a, b) => a.value - b.value); if (ds.length) heal(p, ds[0], 1, newCtx()); }
          if (ev.backupWindow) for (const d of boardDice(p).filter(x => x.value === 6 && !x.ready)) heal(p, d, 1, newCtx());
        }
        if (ev.intelAll || ev.staffShortage || ev.autoHeal || ev.backupWindow) log(`${ev.name} applied.`, "warn");
      }
      go("activate", "consultant"); return NEXT;
    },
    consultant() {
      for (const p of G.players) {
        const c = p.specialists.find(s => s.type === "consultant");
        if (!c || p.consultantDone) continue;
        const others = p.specialists.filter(s => s.type !== "consultant");
        if (!others.length) { p.consultantDone = true; continue; }
        if (p.isBot) { applyConsultant(p, botConsultant(p)); continue; }
        G.actor = p.id; return WAIT;
      }
      go("activate", "human"); return NEXT;
    },
    human() {
      const p = human();
      if (p.actDone) { go("activate", "bots"); return NEXT; }
      G.actor = 0; return WAIT;
    },
    bots() {
      for (const p of G.players) if (p.isBot && !p.actDone) { botActivate(p); p.actDone = true; }
      go("neglect", "run");
      return animate([{ type: "render" }, { type: "wait", delay: 500 }]);
    },
  },
  neglect: {
    run() {
      const fx = [];
      const ev = currentEvent(), quiet = neglectDamage() === 0;
      for (const p of G.players) {
        const res = runNeglect(p);
        p.neglectResults = res;
        const dead = res.filter(r => r.dead).length, hit = res.filter(r => !r.dead && !r.shielded).length;
        if (!p.isBot) {
          if (dead) log(`Dwell time: ${dead} ${plural(dead, "host")} lost. ${plural(dead, "Breach", "Breaches")} logged.`, "bad");
          else if (hit) log(`Dwell time: ${hit} queued ${plural(hit, "host")} degraded.`, "warn");
          else if (quiet && ev) log(`Dwell time: ${ev.name}, nothing degrades this shift.`, "good");
          else if (res.some(r => r.shielded)) log("Dwell time: containment held.", "good");
          else log("Dwell time: nothing left in the queue to degrade.", "good");
          if (dead) fx.push({ type: "sfx", name: "breach" });
          else if (hit) fx.push({ type: "sfx", name: "degrade" });
        } else if (dead) log(`${p.name}: ${dead} ${plural(dead, "breach", "breaches")} from dwell time.`, "sys");
      }
      if (G.cfg.city) { const r = cityNeglect(); if (r.dead) fx.push({ type: "sfx", name: "breach" }); }
      if (ev && ev.breachExtra) for (const p of G.players) if (p.breachesThisRound) p.score -= ev.breachExtra * p.breachesThisRound;
      go("discharge", G.cfg.solo ? "reports" : "score");
      return animate([{ type: "render" }, { type: "fx", sel: "#wards .slot.u .die", cls: "shake" }, ...fx, { type: "wait", delay: 700 }]);
    },
  },
  discharge: {
    reports() {
      if (!G.reportPool) G.reportPool = dischargeCounts(human());
      if (completableReports().length) { G.actor = 0; return WAIT; }
      go("discharge", "score"); return NEXT;
    },
    score() {
      const ev = currentEvent();
      // A pink host still waiting for the rest of its family stays at 6.
      for (const p of G.players) { const n = unreadyPink(p); if (n && !p.isBot) log(`${n} pink ${plural(n, "host")} waited in vain: back to 6, the family restores together or not at all.`, "warn"); }
      const results = G.players.map(p => ({ p, r: scoreDischarges(p) }));
      const max = Math.max(...results.map(x => x.r.n));
      if (max > 0) for (const { p, r } of results) {
        if (r.n === max && p.admin && ADMIN_DEFS[p.admin].kind === "most") { p.score += 1; r.notes.push("Executive Visibility +1"); }
        if (r.n === max && ev && ev.mostBonus) { p.score += ev.mostBonus; r.notes.push(`${ev.name} +${ev.mostBonus}`); }
      }
      for (const { p, r } of results) {
        if (!p.isBot) {
          if (r.n) log(`Restored ${r.n} ${plural(r.n, "host")} this shift: +${r.pts} reputation${r.notes.length ? " (" + r.notes.join(", ") + ")" : ""}.`, "good");
          else log(`No hosts restored this shift.${r.notes.length ? " " + r.notes.join(", ") + "." : ""}`, "warn");
        } else if (r.n) log(`${p.name} restored ${r.n}: +${r.pts + r.bonus}.`, "sys");
        for (const d of p.dischargedThisRound) { if (d.colour === PINK) { if (d.infant) G.supply.infant++; else G.supply.mother++; } else G.bag[d.colour]++; }
        p.dischargedThisRound = [];
      }
      G.reportPool = null; G.reportsDone = false;
      if (G.round >= ROUNDS) go("final", G.cfg.collections ? "collections" : "score");
      else go("shift", "run");
      const mine = results[0].r;
      const fx = mine.n >= 3 ? [{ type: "banner", text: `Restored ×${mine.n}`, sub: `+${mine.pts + mine.bonus} reputation${mine.notes.length ? " · " + mine.notes.join(" · ") : ""}`, delay: 1500 }] : [];
      return animate([{ type: "render" }, { type: "sfx", name: "score" }, ...fx, { type: "wait", delay: 600 }]);
    },
  },
  shift: {
    run() {
      for (const p of G.players) {
        p.meeples = p.meeples.filter(m => !m.temp); // a Contractor works one shift
        for (const m of p.meeples) { m.used = false; m.deptUid = null; m.off = false; m.invest = false; }
        p.invested = false; p.upgradeFired = false;
        p.cityStart = null; p.cityAt = null; p.cityTrail = []; p.cityDone = false; p.keepPending = false; p.laneDone = false; p.heliUsed = false;
        for (const d of p.departments) { if (d.used) d.idleRounds = 0; else if (d.improvement) d.idleRounds++; d.used = false; }
        for (const { b } of beds(p)) if (b.t) { b.u = b.t; b.t = null; b.u.treated = false; b.u.tmpColour = null; }
        // Guest segments: rested, and closed once their guests have left with the hypervisor.
        for (const n of p.nurseries || []) { n.used = false; if (!n.dice.length) n.open = false; for (const d of n.dice) d.treated = false; }
        p.ambulance = null; p.took = false; p.returnDone = false; p.returnOpen = false; p.actDone = false; p.consultantDone = false; p.consultantCopy = null;
        p.breachesThisRound = 0; p.neglectResults = null; p.botSummary = "";
      }
      for (const a of G.ambulances) { a.dice = []; a.takenBy = null; }
      if (G.investBoard) { G.investBoard = { red: [], yellow: [], green: [] }; G.invest = null; }
      if (G.events && G.events.current) { G.events.current = null; }
      G.eventApplied = false;
      G.extraChoice = null; // a 2-SOC table: the Incident Commander chooses the extra reveal afresh each shift
      recycleDisplay();
      G.round++;
      log(`Shift ${G.round} begins.`, "sys");
      go("shift", "extraReveal"); return NEXT;
    },
    extraReveal() { return stepExtraReveal("intake", "draw"); },
  },
  final: {
    collections() {
      if (!G.collections) {
        const n = G.players.length;
        const ambs = [];
        for (let i = 0; i < n; i++) ambs.push({ num: i + 1, slots: [0, 1, 2].map(() => ({ colour: COLOURS[rint(3)], value: 2 + rint(4), uid: null })) });

      }

      let guard = 0;
      while (guard++ < 200) {
        const open = C.ambs.flatMap(a => a.slots).filter(s => !s.uid);
        if (!open.length || C.order.every(id => C.passed[id])) break;
        const pid = C.order[C.cursor % C.order.length];
        const p = G.players[pid];
        if (C.passed[pid]) { C.cursor++; continue; }
        const legal = collectionMoves(p);
        if (!legal.length) { C.passed[pid] = true; C.cursor++; continue; }
        if (p.isBot) { const mv = botCollection(p, legal); if (mv) applyCollect(p, mv.uid, mv.amb, mv.slot); else { C.passed[pid] = true; C.cursor++; } continue; }
        G.actor = pid; return WAIT;
      }
      go("final", "score"); return NEXT;
    },
    score() {
      finalScore();
      G.gameOver = true;
      if (!UI.headless) clearSave(); // a headless game (the title's table, runSim) is never the one saved
      const w = G.final.winners.map(id => G.players[id].name);
      log(G.cfg.solo ? `Final reputation: ${human().total}.` : `${w.join(" and ")} ${w.length > 1 ? "share the win" : (w[0] === "You" ? "win" : "wins")}.`, "good");
      go("gameover", "done");
      if (!UI.headless) setTimeout(() => showGameOver(), 400);
      return NEXT;
    },
  },
  gameover: { done() { return WAIT; } },
};
// Overtime: the closing board plays on for another eight shifts. Nothing
// resets but the shift counter: hosts, staff, tools, upgrades, reputation,
// breaches and intel all carry over, and the final accounting is redone at
// the next close over everything so far.
function startOvertime() {
  if (!G || !G.gameOver) return;
  closeModal();
  G.gameOver = false; G.final = null; G.collections = null;
  G.overtime = (G.overtime || 0) + 1;
  G.round = 0; // the shift change that follows opens shift 1
  for (const p of G.players) { p.breakdown = null; p.total = undefined; }
  log(`Overtime ${G.overtime}: the shift counter resets, the board stays.`, "warn");
  go("shift", "run");
  resetSel(); UI.undo = []; UI.undoBarrier = 0;
  advance();
}

function stepExtraReveal(nextPhase, nextStep) {
  if (G.players.length === 2) {
    if (G.extraChoice === null) {
      const fp = G.players[G.firstPlayer];
      if (fp.isBot) { applyExtraChoice(botExtraChoice(fp)); }
      else { G.actor = fp.id; return WAIT; }
    }
  }
  refillDisplay();
  G.extraChoice = G.players.length === 2 ? G.extraChoice : null;
  go(nextPhase, nextStep);
  return NEXT;
}
function revealEvent() {
  if (!G.events.deck.length) G.events.deck = shuffle(Object.keys(EVENT_DEFS));
  G.events.current = G.events.deck.pop();
  const ev = EVENT_DEFS[G.events.current];
  log(`Incident event: ${ev.name} — ${ev.desc}`, "warn");
}
function collectionMoves(p) {
  const out = [];
  if (!G.collections) return out;
  G.collections.ambs.forEach((a, ai) => a.slots.forEach((s, si) => {
    if (s.uid) return;
    for (const d of boardDice(p)) if (d.colour === s.colour && d.value === s.value) out.push({ uid: d.uid, amb: ai, slot: si });
  }));
  return out;
}

// ---- appliers: mutate + set the next step, shared by UI handlers and bots ----
function applyAdmin(p, id) {
  p.admin = id; p.adminChoice = null;
  if (!p.isBot) log(`CISO Directive: ${ADMIN_DEFS[id].name}.`, "sys");
}
function swapStartValues(p, uidA, uidB) {
  const a = p.startDice.find(d => d.uid === uidA), b = p.startDice.find(d => d.uid === uidB);
  if (a && b) { const t = a.value; a.value = b.value; b.value = t; }
}
function applyStartConfirm(p) {
  for (const d of p.startDice) placeDie(p, d);
  p.startDice = [];
  if (p.startMother && G.supply.mother > 0) {
    G.supply.mother--;
    const wi = motherWardOptions(p).free[0];
    admitMother(p, makePinkDie("mother", MAT.startValue), wi, 1);
    if (!p.isBot) log("A hypervisor at 4 and its guest start in a segment of their own.", "sys");
  }
  p.startMother = false;
}
function applyExtraChoice(kind) {
  G.extraChoice = kind;
  // The 2-player extra reveal is a fresh draw on top of the standard display.
  const fp = G.players[G.firstPlayer];
  log(`${fp.name} reveal${fp.isBot ? "s" : ""} an extra ${kind === "dept" ? "tool" : "specialist"}.`, "sys");
}
function applyKeep(p, uids) {
  const kept = p.pendingDice.filter(d => uids.includes(d.uid));
  const dropped = p.pendingDice.filter(d => !uids.includes(d.uid) && d.uid !== p.epidemicDie);
  const epi = p.pendingDice.filter(d => d.uid === p.epidemicDie);
  for (const d of dropped) returnToBag(d);
  p.pendingDice = kept.concat(epi);

    if (b.u) dice.push({ uid: b.u.uid, c: effColour(b.u), v: b.u.value, w: wi, b: bi, row: 0 });
    if (b.t) dice.push({ uid: b.t.uid, c: effColour(b.t), v: b.t.value, w: wi, b: bi, row: 1 });
  }));

    r: Math.min(G.round, ROUNDS), score: p.score, restored: p.dischargedTotal, breaches: p.fatalities,
    staff: p.meeples.filter(m => !m.off).map(m => ({ c: m.colour, name: meepleLabel(p, m), ab: tableAbility(specDefForMeeple(p, m)), used: m.used })),
    tools: p.departments.slice(0, 8).map(d => ({ uid: d.uid, name: DEPT_DEFS[d.type].name, tag: DEPT_DEFS[d.type].tag, used: d.used })),

  if (t.choice === "pathologist") return { text: "close a breach → +1 intel" };

/* One beat on: the dice move to where it has them, and the board follows. */
function tableAdvance(T, now, L) {

  T.i++;

  for (const nd of b.dice) {
    seen.add(nd.uid);
    const slot = L.slots.find(s => s.w === nd.w && s.b === nd.b && s.row === nd.row);
    const d = T.dice.get(nd.uid);
    if (!d) { T.dice.set(nd.uid, { c: nd.c, v: nd.v, x: slot.x, y: slot.y, fx: slot.x, fy: slot.y, t0: now, born: true }); continue; }
    const at = { x: d.x, y: d.y };
    if (at.x !== slot.x || at.y !== slot.y) { d.fx = at.x; d.fy = at.y; d.x = slot.x; d.y = slot.y; d.t0 = now; d.born = false; }
    if (nd.v !== d.v) { d.pulse = { t: now, c: nd.v > d.v ? "#4ade6a" : "#ff3333" }; d.v = nd.v; }

  for (const [uid, d] of T.dice) {

  if (still) T.i = Math.max(T.i, Math.floor(T.beats.length * 0.45));
  for (const nd of T.beats[T.i].dice) {
    const s = L.slots.find(x => x.w === nd.w && x.b === nd.b && x.row === nd.row);
    T.dice.set(nd.uid, { c: nd.c, v: nd.v, x: s.x, y: s.y, fx: s.x, fy: s.y, t0: -1e9, born: false });

// Solo has no rival to beat, so the scorecard grades the total instead, on a
// scale of its own: solo is a shift-by-shift chase with Audit Reports pulling
// the total down, not a race, so rival-mode totals are no yardstick. Bands from
// bot play: a greedy top-skill bot lands at 6 on the median shift and 25 at
// its 90th percentile; a planned report chain reaches the 30s.

function gradeScale() { return SOLO_GRADES.map(([min, g]) => `${g} ${min}+`).join(", ") + ", F below"; }

    html = `<h2 class="${good ? "win" : ""}">${G.overtime ? `Overtime ${G.overtime} closed` : "Shift 8 closed"}</h2><div class="grade ${good ? "win" : ""}" title="${esc("Solo grade: " + gradeScale())}">${grade}</div><div class="menu-tagline">${esc(pick(FLAVOR.solo))}</div>
      <table class="score-table">
        <tr><td>Restorations and filed reports</td><td>${b.base}</td></tr>
        <tr><td>Breaches (${p.fatalities})</td><td>${b.fatalities}</td></tr>
        <tr><td>Intel tokens (${p.bloodBags})</td><td>+${b.bloodBags}</td></tr>
        <tr><td>Unfiled reports (${b.incompleteReports})</td><td>${b.reports}</td></tr>
        <tr><td class="tot">Final reputation</td><td class="tot">${b.total}</td></tr>
      </table>
      <p style="text-align:center">${p.dischargedTotal} hosts restored over ${ROUNDS * (1 + (G.overtime || 0))} shifts.</p>
      <p class="hint" style="text-align:center">Solo grade: ${esc(gradeScale())}.</p>`;
  } else {
    sfx(won ? "win" : "lose");
    html = `<h2 class="${won ? "win" : ""}">${won ? (G.final.winners.length > 1 ? "Shared win" : "Your SOC wins") : "Out-triaged"}</h2><div class="menu-tagline">${esc(pick(won ? FLAVOR.win : FLAVOR.lose))}</div>
      <table class="help-table"><tr><th>#</th><th>SOC</th><th>Reputation</th><th>Breaches</th><th>Intel</th><th>Restored</th>${G.cfg.collections ? "<th>Handover</th>" : ""}<th>Total</th></tr>`;
    G.final.ranking.forEach((id, i) => {
      const p = G.players[id], b = p.breakdown;
      html += `<tr style="${id === 0 ? "color:var(--accent)" : ""}"><td>${i + 1}</td><td>${esc(p.name)}</td><td>${b.base}</td><td>${b.fatalities}</td><td>+${b.bloodBags}</td><td>${p.dischargedTotal}</td>${G.cfg.collections ? `<td>${b.collections + b.leftover}</td>` : ""}<td><b>${b.total}</b></td></tr>`;
    });
    html += `</table><p class="hint">${G.overtime ? `After ${G.overtime === 1 ? "one overtime" : G.overtime + " overtimes"}: ${ROUNDS * (1 + G.overtime)} shifts in all. ` : ""}Ties break on fewer hosts left, then higher total integrity.</p>`;
  }
  mc.innerHTML = html + `<div class="modal-actions"><button class="action-btn primary" onclick="toTitle()">Menu</button><button class="action-btn" onclick="startOvertime()" title="Play on from this board for another eight shifts. Everything carries over; only the shift counter resets.">Overtime</button></div>`;
  openModal(true);
}

/* ============================================================
   TUTORIAL
   ============================================================ */
const TUTORIAL_STEPS = [
  ["Welcome, Commander", "Compromised hosts arrive as dice. The face is integrity: 1 is nearly lost, 6 is nearly clean. Push a host past 6 and it is restored to production for reputation."],
  ["Quarantine", "Your four segments hold three hosts each. New hosts land in the upper Queued slot. Anything still Queued at the end of a shift degrades by 1, and a 1 that degrades is a breach."],
  ["Tools and staff", "During Activation, click an analyst, then a tool, then the glowing hosts it can work on. Double-click a host to confirm; a slow second click deselects it instead. The host moves to its Worked slot and is safe from dwell time this shift."],
  ["Colours", "Red, yellow and green are just colours. Some tools and specialists only work on one colour. An intel token can retag a host for a shift when you need a match."],
  ["Improve", "Each shift you take one improvement: a tool gives you more ways to heal, a specialist gives you an extra pair of hands with a follow-up ability."],
  ["Escalation queues", "Lower-numbered queues carry sicker hosts, but their owner improves first, and the lowest taken earns an intel token and the Commander role. Don't take more than you can house."],
  ["Score", "Restoring several hosts in the same shift scores more per host. Plan a big Restoration rather than trickling. Eight shifts. Good luck."],
];
function tutorialSeen() { try { return localStorage.getItem(TUTORIAL_KEY) === "1"; } catch (e) { return false; } }
function showTutorial(i) {
  const mc = document.getElementById("modal-content");
  if (i >= TUTORIAL_STEPS.length) { endTutorial(); return; }
  const [t, body] = TUTORIAL_STEPS[i];
  mc.innerHTML = `<h2>${esc(t)}</h2><div class="menu-tagline">Tutorial ${i + 1} of ${TUTORIAL_STEPS.length}</div><p class="tut-step">${esc(tw(body))}</p>
    <div class="modal-actions"><button class="action-btn primary" onclick="showTutorial(${i + 1})">${i + 1 === TUTORIAL_STEPS.length ? "Start" : "Next"}</button><button class="action-btn" onclick="endTutorial()">Skip</button></div>`;
  openModal(false);
}
function endTutorial() {
  try { localStorage.setItem(TUTORIAL_KEY, "1"); } catch (e) {}
  closeModal();
  advance();
}

/* ============================================================
   INIT & DEBUG HOOKS
   ============================================================ */
/* The room behind the game: one line-drawn SOC, drawn once. Composed for a
   1600x900 box drawn "xMidYMax slice": a row of racks runs the width of the
   room, showing in the side margins and wherever the floating game ends, and
   the floor in the bottom band it leaves showing; above the racks, only the
   dark. The room moves a little (the CSS's scene-* keyframes), unless motion
   is reduced or a README screenshot is being taken. */
function sceneSVG() {
  let seed = 7;
  const rnd = n => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed % n; };
  // the room's layout is seeded and fixed; its motion takes its own numbers,
  // so a still room and a moving one are the same room
  const mr = n => Math.floor(Math.random() * n);
  const moving = !UI.reducedMotion && !/[#&]shot=/.test(location.hash);
  const G = 820;  // floor line
  let o = '';
  // The raised floor, tiles running to a vanishing point behind the game, a
  // lamp's pool on it under the game, and a band of light running down it.
  for (let y = G; y <= 900; y += 22) o += `<path class="sfl" d="M0 ${y} H1600"/>`;
  for (let x = -1600; x <= 3200; x += 120) o += `<path class="sfl" d="M800 ${G - 180} L${x} 900" clip-path="url(#floor)"/>`;
  o += `<ellipse cx="800" cy="${G + 40}" rx="760" ry="70" fill="url(#pool)"/>`;
  if (moving) o += `<g clip-path="url(#floor)"><rect class="sweep" x="0" y="${G + 20}" width="1600" height="26" fill="url(#band)"/></g>`;
  // Racks: a row of cabinets wall to wall, each with its door frame and
  // vents, its units, a few lights on (some flicker with traffic, the amber
  // ones blink), and the tray its cables climb to. The ones behind the game
  // flicker less: mostly nobody sees them, and every light that moves costs.
  const rack = (x, h, busy) => {
    const top = G - h;
    let r = `<rect class="sf" x="${x}" y="${top}" width="74" height="${h}" rx="2"/><rect class="sd" x="${x + 4}" y="${top + 4}" width="66" height="${h - 8}" rx="1"/>`;
    for (let y = top + 12; y < G - 14; y += 15) {
      r += `<rect class="su" x="${x + 8}" y="${y}" width="58" height="10"/>`;
      if (rnd(100) < 55) {
        const c = rnd(100), cls = c < 8 ? "lw" : c < 45 ? "lg" : "la", blink = moving && (cls === "lw" || mr(100) < busy);
        r += `<rect class="${cls}${blink ? " bl" + (cls === "lw" ? " slow" : "") : ""}" x="${x + 54}" y="${y + 3}" width="6" height="4"${blink ? ` style="--d:${(cls === "lw" ? 18 : 9 + mr(40)) / 10}s;--o:${-mr(40) / 10}s"` : ""}/>`;
      } else if (rnd(100) < 40) r += `<path class="sv" d="M${x + 12} ${y + 5} H${x + 40}"/>`;
    }
    return r + `<path class="sl" d="M${x + 20} ${top} V${top - 40} M${x + 54} ${top} V${top - 40}"/>`;
  };
  let racks = '';
  for (let i = 0; i < 19; i++) { const x = 8 + i * 84; racks += rack(x, 420 + rnd(90), x < 300 || x > 1240 ? 30 : 8); }
  o += `<path class="sl" d="M0 ${G - 560} H1600"/>` + racks;
  o += `<text class="stx" x="1500" y="${G + 44}" text-anchor="end">SOC-01</text><text class="stx sm" x="1500" y="${G + 64}" text-anchor="end">INCIDENT RESPONSE · TIER 2</text>`;
  const defs = `<clipPath id="floor"><rect x="0" y="${G}" width="1600" height="${900 - G}"/></clipPath>` +
    `<radialGradient id="pool"><stop offset="0" stop-color="#54f2ff" stop-opacity=".07"/><stop offset="1" stop-color="#54f2ff" stop-opacity="0"/></radialGradient>` +
    `<linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54f2ff" stop-opacity="0"/><stop offset=".5" stop-color="#54f2ff" stop-opacity=".05"/><stop offset="1" stop-color="#54f2ff" stop-opacity="0"/></linearGradient>`;
  return `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"><defs>${defs}</defs>${o}</svg>`;
}
function init() {
  const scene = document.getElementById("scene");
  if (scene) scene.innerHTML = sceneSVG();
  setupTips();
  setupInput();
  try { if (localStorage.getItem("pumatriage_muted_v1") === "1") { UI.muted = true; document.getElementById("mute-btn").setAttribute("aria-pressed", "false"); } } catch (e) {}
  try { const sp = parseInt(localStorage.getItem("pumatriage_speed_v1") || "1", 10); if (sp >= 1 && sp <= 3) { UI.speed = sp; const b = document.getElementById("speed-btn"); if (b) b.textContent = SPEED_LABEL[sp]; } } catch (e) {}
  document.getElementById("board").innerHTML = '<h3>Your SOC</h3><div class="hint">No active shift.</div>';
  const shot = /[#&]shot=([a-z]+)/.exec(location.hash);
  if (shot) { screenshotState(shot[1]); return; }
  /* Every load opens on the title, under the boot sequence. The integrated
     intro (games-meta STANDARD.md §14): canon's boot with the meow -- unless
     sound is off -- then the hold that lets sound play, then the table. */
  const saved = hasSave();
  const intro = startIntro({ lines: [bootReloadLine(), "one file: nothing to fetch"], audio: titleAudio, bootSound: UI.muted ? false : gkBootSound });
  openTitle();
  intro.finish({
    more: [saved ? `shift ${Math.min(saved.round, ROUNDS)} in progress` : "no shift in progress"],
    title: document.querySelector("#title .gk-title"),
    name: "lines",
    /* much quicker than canon's (600, 700, 3000, 4200): the name is down
       within a second of the boot, and the dice start landing as its second
       line does, with no pause between them */
    timing: { name: 0, step: 220, menu: 380, done: 1400 },
    toggles: titleToggles(),
    tick: () => titleSfx(gktFlick, 0.3),
    onContinue: () => { const ac = titleAudio(); if (ac && ac.state !== "running") ac.resume().catch(() => {}); },
  }).then(r => { titleSwitches = r.toggles; introDone = true; });
}
// #shot=setup|midgame|gameover|solo — deterministic states for README screenshots (headless Chromium).
function screenshotState(which) {
  UI.reducedMotion = true;
  houseRules = { ...DIFFICULTY_PRESETS[which === "solo" ? "solo" : "normal"].sliders };
  try { localStorage.setItem(TUTORIAL_KEY, "1"); } catch (e) {}
  newGame(7);
  const stopAt = (ph, st) => { let guard = 0; while (!(G.phase === ph && G.step === st) && !G.gameOver && guard++ < 400) { botAnswerWait(); advance(); } };
  if (which === "setup") { showMainMenu(); return; }
  if (which === "midgame" || which === "solo") {
    advance();
    stopAt("activate", "human");
    for (let i = 0; i < 3 && G.round < 4; i++) { botAnswerWait(); advance(); stopAt("activate", "human"); }
    const p = human();
    const m = p.meeples.find(x => !x.used && !x.off);
    const t = p.departments.find(d => canActivate(d, p));
    if (m && t) { onMeepleClick(m.uid); onDeptClick(t.uid); }
  } else if (which === "gameover") { advance(); stopAt("gameover", "done"); }
  UI.reducedMotion = false;
  updateAll();
  console.log("%cPumaTriage", "color:#54f2ff;font-size:16px;letter-spacing:3px");
  console.log("%cReading the source? Good instinct. __PT.runSim(50) plays bot-vs-bot games headlessly.", "color:#dbe4fb");
}
window.__PT = {
  get G() { return G; }, UI, newGame, advance, commit, legalSets, canActivate, matchesSel, boardDice, human,
  setSeed(n) { if (G) G.rng = n >>> 0; },
  autoHuman(on) { UI.autoHuman = !!on; if (on && G && !G.gameOver) advance(); },
  runSim(n = 20, hr = null, seed = 1) {
    const savedG = G, savedRules = houseRules, savedUI = { headless: UI.headless, autoHuman: UI.autoHuman };
    if (hr) houseRules = { ...houseRules, ...hr };
    UI.headless = true; UI.autoHuman = true;
    const out = { games: 0, avgScore: 0, avgFatalities: 0, avgDischarges: 0, winsByIndex: {}, crashes: [], min: Infinity, max: -Infinity };
    for (let s = seed; s < seed + n; s++) {
      try {
        newGame(s); human().skill = houseRules.rivalSkill; advance();
        const h = human();
        out.games++; out.avgScore += h.total; out.avgFatalities += h.fatalities; out.avgDischarges += h.dischargedTotal;
        out.min = Math.min(out.min, h.total); out.max = Math.max(out.max, h.total);
        for (const id of G.final.winners) out.winsByIndex[id] = (out.winsByIndex[id] || 0) + 1;
      } catch (e) { out.crashes.push({ seed: s, error: e.message }); }
    }
    if (out.games) { out.avgScore /= out.games; out.avgFatalities /= out.games; out.avgDischarges /= out.games; }
    G = savedG; houseRules = savedRules; UI.headless = savedUI.headless; UI.autoHuman = savedUI.autoHuman;
    return out;
  },
  assertInvariants,
};
document.addEventListener("DOMContentLoaded", init);
</script>
