        <li><b>Quarantine segments</b> Q1–Q4 hold 3 hosts each: 12 slots total. A host sits in the upper <b>Queued</b> slot until it is worked on, then moves to the lower <b>Worked</b> slot.</li>
        <li><b>Tools</b> are staffed by placing one analyst or specialist. Each tool and each staff member acts once per shift. A tool can only be used if its whole effect can be resolved.</li>
        <li><b>Analysts</b> (white) are your starting staff. <b>Specialists</b> are hired staff with a follow-up ability that triggers after the tool they staff.</li>
        <li><b>Intel tokens</b>: during activation, spend one to heal any host 1 step or to retag a host's colour before a tool resolves on it. Unspent tokens are worth 1 reputation each at the end.</li>
      </ul>
      <h4>Scoring a shift</h4>
      <p>Hosts restored in one shift score together: 1st = 1, 2nd–6th = 2 each, 7th–8th = 3 each, 9th–10th = 4 each, 11th–12th = 5 each. Restore 3 for 5 points, 6 for 11, 8 for 17. Clearing all four segments scores 5 more. At the end: −2 per breach, +1 per intel token.</p>
    </div>
    <div ${panel("shifts")}>
      <ol>
        <li><b>Intake.</b> Three hosts are rolled per escalation queue (1s and 6s re-rolled), lowest values into queue #1. Starting with the Incident Commander, each SOC takes one queue. The Commander may not take #1. Whoever takes the lowest-numbered queue gets an intel token and becomes Commander. If your segments cannot fit the new hosts, existing hosts are written off as breaches.</li>
        <li><b>Improvement.</b> In queue-number order, each SOC takes one item from the display: a tool or a specialist. Then each SOC may return one improvement to the bottom of its stack for an intel token; you get that offer at the top of activation, until your first placement.</li>
        <li><b>Activation.</b> Place staff on tools one at a time, resolving each. The first time a host is healed in a shift it moves to its Worked slot. Healing to 7 restores the host immediately. A specialist's follow-up fires once, after its tool, and like a tool it needs its full set of targets or it does nothing; when only one choice is legal it fires by itself. The strip reports what each follow-up did.</li>
        <li><b>Dwell time.</b> Every host still Queued loses 1 integrity. A 1 that drops becomes a breach.</li>
        <li><b>Restoration.</b> Score this shift's restored hosts. Directives apply here.</li>
        <li><b>Shift change.</b> Staff return, Worked hosts move back to Queued, the display is recycled and refilled. Skipped after shift 8.</li>
      </ol>
    </div>
    <div ${panel("tools")}><table class="help-table"><tr><th>Tool</th><th>Staff it to…</th></tr>${toolRows}</table><p class="hint">The starting SOC has one of each of the six starting tools. Improvement tools come two of each in the stack.</p></div>
    <div ${panel("specs")}><table class="help-table"><tr><th>Specialist</th><th>Follow-up</th></tr>${specRows}</table><p class="hint">Any staff member can staff any tool; colours only matter for the follow-up trigger.</p></div>
    <div ${panel("solo")}>
      <h4>CISO Directives (rivals mode)</h4>
      <p>Each SOC is dealt two and keeps one.</p>
      <table class="help-table">${adminRows}</table>
      <h4>Solo score-chase</h4>
      <ul>
        <li>No queues. Each intake you roll 4 hosts and keep 3. If the kept total is under 9, take an intel token.</li>
        <li>Each improvement phase reveals one tool and one specialist. Take one; the other goes to the bottom.</li>
        <li>Six <b>Audit Reports</b> are dealt in two rows of three. During Restoration you may file bottom-row reports using this shift's restored hosts (each host counts for one report). The card above slides down and can be filed immediately.</li>
        <li>Restorations score as normal. At the end, filed reports add their value; every report still on display subtracts its value.</li>
      </ul>
    </div>
    <div ${panel("addons")}>
      <table class="help-table">
        <tr><td>Promo Specialists</td><td>Consultant (copies a specialist each shift) and Intake Coordinator replace two random specialists in the deck.</td></tr>
        <tr><td>Beta Tooling</td><td>The Experimental Medicine set: Beta Agent, Retagging Desk, Rollback Snapshot, Tabletop Exercise, plus six specialists. The tool stack is rebuilt as the mini-expansion describes.</td></tr>
        <tr><td>Incident Events</td><td>From shift 2, an event card each shift. These are PumaTriage originals.</td></tr>
        <tr><td>Inherited Mess</td><td>Start with five hosts at 3, 3, 4, 5, 5.</td></tr>
        <tr><td>Worm Outbreak</td><td>Every intake, each SOC also draws and rolls one extra host straight into quarantine.</td></tr>
        <tr><td>Persistent Threat</td><td>Dwell time degrades queued hosts by 2.</td></tr>
        <tr><td>MSSP Handover</td><td>After shift 8, outside providers show colour-and-value slots. Hand matching hosts over for +1 each; every host left costs 1.</td></tr>
        <tr><td>Solo penalties</td><td>Double the breach penalty and/or the incomplete-report penalty.</td></tr>
      </table>
      <h4>Incident Events</h4>
      <table class="help-table">${eventRows}</table>
    </div>
    <div ${panel("expansions")}>
      <h4>Virtualization</h4>
      <p>Switch it on under Expansions in the setup menu (rival games only). Pink dice join the table: <b>hypervisors</b> (full size) and their <b>guests</b> (small). Pink is a colour of its own: colour-specific tools and specialists ignore it, value-based and "any colour" effects work on it, and nothing can retag or re-roll a pink host.</p>
      <ul>
        <li><b>Setup.</b> Every SOC starts with a 4th analyst, a hypervisor at 4 alone in a segment, and one guest at 4 in the guest segment below it. Two virtualization tools and two virtualization specialists (one each with a single rival) join the display from their own piles.</li>
        <li><b>Intake.</b> Fewer coloured hosts are rolled and hypervisors are added: 2 with one or two rivals, 3 with three. At most one hypervisor per queue: a second moves to the next queue and a coloured host swaps back. No SOC holds more than 4 hypervisors; at the cap a queue carrying one is off limits unless every open queue does, and then the hypervisor is swapped for a coloured host of the same value.</li>
        <li><b>Placement.</b> You choose the segment for each incoming host. A hypervisor goes in a segment with no other hypervisor (a full one is allowed: one host there moves to a free bed elsewhere). It opens the guest segment below it and brings one guest or twins at value 4, rolled on the provisioning die. Hosts never move between segments otherwise.</li>
        <li><b>Guest segments.</b> While it holds guests, each guest segment is a placement: one staff member there heals one pink host (hypervisor or guest) 1 step, once per shift. A specialist's follow-up applies as usual.</li>
        <li><b>Dwell time.</b> A queued hypervisor only degrades when other hosts share its segment, and never below 1: hypervisors never breach. Guests never lose a step, for any reason.</li>
        <li><b>Restoration.</b> A pink host healed past 6 is set aside, ready, until the hypervisor and all its guests are ready; then they restore together and score with everything else. Anything still waiting at the end of the shift drops back to 6. Up to 20 hosts can restore in a shift: 13–20 score 40, 46, 52, 68, 75, 82, 90, 98. The clear-segments bonus needs the guest segments empty too.</li>
        <li><b>Directives.</b> Provisioning Policy: choose one guest or twins. Tenant Bonus: +3 for two hypervisors and two guests restored in one shift.</li>
      </ul>
      <p>The provisioning die shows twins on 2 faces of 6. The piles hold two of each tool and specialist.</p>
      <h4>Network</h4>
      <p>Switch it on under Expansions in the setup menu (rival games only). Intake is replaced: instead of escalation queues, the compromised hosts sit on a <b>network map</b> of zones joined by links, one host per zone at the start, and every SOC sends a responder out to collect 3 of them each shift.</p>
      <ul>
        <li><b>Jump hosts.</b> Zones on the edge of the map with a link to the outside are ingress points. In shift 1 each SOC sets up its jump host at a free one, in Commander order. From shift 2 each SOC, in response order, may move its jump host up to 2 free ingress points either way round the map (held ones are skipped, not counted), or stay. The Incident Commander holds <b>remote access</b> and may drop in on any free zone instead, even one in the middle.</li>
        <li><b>Collecting.</b> The responder starts on the jump host's zone and takes the host there if it holds one. It then walks to zones joined by a link, and every host it steps on comes along, until it has 3. Empty zones can be crossed. A host at 2 carries a <b>recon token</b>; it comes along too. Of the tokens picked up in one shift only one is kept. Once a row or column of the map is empty it is refilled at once.</li>
        <li><b>Response order.</b> The lowest intake total goes first for the rest of the shift and takes the Incident Commander role, remote access and an intel token; ties go to whoever collected later. A Priority Lane token spent before the order is read counts −2.</li>
        <li><b>Recon tokens.</b> Hotfix: heal any host 1 step. Red, Yellow or Green Hotfix: heal a host of that colour 2 steps. Contractor: an extra analyst for one shift. All spent in activation, as many as you like; the healed host counts as worked. Priority Lane is spent at intake. Unspent tokens score nothing.</li>
        <li><b>Dwell time.</b> Every host still on the map degrades 1 step too. A drop to 2 brings a recon token onto its zone. Hosts lost out there are breaches, dealt one at a time from the back of the response order.</li>
        <li><b>With Virtualization.</b> A few zones spawn hypervisors instead of coloured hosts. A responder collects at most one hypervisor per shift and passes over any others as if the zone were empty. Hypervisors on the map never drop below 1.</li>
      </ul>
      <p>Not printed in the rulebook, so approximated: the links on the 20 zone tiles (4 crossroads, 8 T-junctions, 4 straights, 4 corners here), the split of the 30 recon tokens (5 of each kind) and the number of hypervisor zones by table size (2, 3, 4).</p>
    </div>
    <div ${panel("keys")}>
      <ul>
        <li><b>1–9</b> — select an analyst or specialist</li>
        <li><b>Enter</b> — confirm the highlighted action</li>
        <li><b>Escape</b> — cancel the current selection / close a dialog</li>
        <li><b>U</b> — undo the last placement (not past a re-roll)</li>
        <li><b>E</b> — end activation</li>
        <li><b>B</b> — spend an intel token to heal</li>
        <li><b>H</b> or <b>?</b> — this help</li>
        <li><b>M</b> — toggle sound</li>
        <li><b>S</b> — rival and phase speed: normal, fast, instant</li>
        <li><b>Double-click a host</b> — confirm the current selection (a slow second click deselects it instead)</li>
        <li><b>Tab</b> — every host, tool and analyst is reachable by keyboard</li>
      </ul>
    </div>
    <div ${panel("about")}>
      <div style="text-align:center;padding:40px 20px;">
        <p style="font-size:14px;color:var(--amber);margin-bottom:16px;">PumaTriage</p>
        <p style="font-size:12px;margin-bottom:8px;">Incident Response Dice Game</p>
        <p style="margin-bottom:24px;">Built by <a href="https://www.greykit.com" target="_blank" rel="noopener">greykit.com</a></p>
        <p style="font-size:10px;color:var(--text-dim);">Inspired by Dice Hospital by Stanislav Kordonskiy and Mike Nudd / Alley Cat Games.<br>A one-for-one port of the base rules, re-themed for the SOC. Everything beyond the base game is an opt-in house rule.</p>
      </div>
    </div>
    <div class="modal-actions"><button class="action-btn" onclick="${closeAction}">${G ? "Close" : "Back"}</button></div>`;
  openModal(true);
}
function gradeFor(total) { return total >= 60 ? "S" : total >= 45 ? "A" : total >= 30 ? "B" : total >= 15 ? "C" : "F"; }
function showGameOver() {
  if (!G || !G.final) return;
  const mc = document.getElementById("modal-content");
  const won = G.final.winners.includes(0);
  let html;
  if (G.cfg.solo) {
    const p = human(), b = p.breakdown;
    sfx(b.total >= 30 ? "win" : "lose");
    html = `<h2 class="${b.total >= 45 ? "win" : ""}">Shift 8 closed</h2><div class="grade ${b.total >= 45 ? "win" : ""}">${gradeFor(b.total)}</div><div class="menu-tagline">${esc(pick(FLAVOR.solo))}</div>
      <table class="score-table">
        <tr><td>Restorations and filed reports</td><td>${b.base}</td></tr>
        <tr><td>Breaches (${p.fatalities})</td><td>${b.fatalities}</td></tr>
        <tr><td>Intel tokens (${p.bloodBags})</td><td>+${b.bloodBags}</td></tr>
        <tr><td>Unfiled reports (${b.incompleteReports})</td><td>${b.reports}</td></tr>
        <tr><td class="tot">Final reputation</td><td class="tot">${b.total}</td></tr>
      </table>
      <p style="text-align:center">${p.dischargedTotal} hosts restored over 8 shifts.</p>`;
  } else {
    sfx(won ? "win" : "lose");
    html = `<h2 class="${won ? "win" : ""}">${won ? (G.final.winners.length > 1 ? "Shared win" : "Your SOC wins") : "Out-triaged"}</h2><div class="menu-tagline">${esc(pick(won ? FLAVOR.win : FLAVOR.lose))}</div>
      <table class="help-table"><tr><th>#</th><th>SOC</th><th>Reputation</th><th>Breaches</th><th>Intel</th><th>Restored</th>${G.cfg.collections ? "<th>Handover</th>" : ""}<th>Total</th></tr>`;
    G.final.ranking.forEach((id, i) => {
      const p = G.players[id], b = p.breakdown;
      html += `<tr style="${id === 0 ? "color:var(--amber)" : ""}"><td>${i + 1}</td><td>${esc(p.name)}</td><td>${b.base}</td><td>${b.fatalities}</td><td>+${b.bloodBags}</td><td>${p.dischargedTotal}</td>${G.cfg.collections ? `<td>${b.collections + b.leftover}</td>` : ""}<td><b>${b.total}</b></td></tr>`;
    });
    html += `</table><p class="hint">Ties break on fewer hosts left, then higher total integrity.</p>`;
  }
  mc.innerHTML = html + `<div class="modal-actions"><button class="action-btn primary" onclick="showMainMenu()">New game</button><button class="action-btn" onclick="closeModal()">Look at the board</button></div>`;
  openModal(true);
}

/* ============================================================
   TUTORIAL
   ============================================================ */
const TUTORIAL_STEPS = [
  ["Welcome, Commander", "Compromised hosts arrive as dice. The face is integrity: 1 is nearly lost, 6 is nearly clean. Push a host past 6 and it is restored to production for reputation."],
  ["Quarantine", "Your four segments hold three hosts each. New hosts land in the upper Queued slot. Anything still Queued at the end of a shift degrades by 1, and a 1 that degrades is a breach."],
  ["Tools and staff", "During Activation, click an analyst, then a tool, then the glowing hosts it can work on. Double-click a host to confirm; a slow second click deselects it instead. The host moves to its Worked slot and is safe from dwell time this shift."],
  ["Colours", "Red, yellow and green are just colours. Some tools and specialists only work on one colour. An intel token can retag a host for a shift when you need a match."],
  ["Improve", "Each shift you take one improvement: a tool gives you more ways to heal, a specialist gives you an extra pair of hands with a follow-up ability."],
  ["Escalation queues", "Lower-numbered queues carry sicker hosts, but their owner improves first, and the lowest taken earns an intel token and the Commander role. Don't take more than you can house."],
  ["Score", "Restoring several hosts in the same shift scores more per host. Plan a big Restoration rather than trickling. Eight shifts. Good luck."],
];
function tutorialSeen() { try { return localStorage.getItem(TUTORIAL_KEY) === "1"; } catch (e) { return false; } }
function showTutorial(i) {
  const mc = document.getElementById("modal-content");
  if (i >= TUTORIAL_STEPS.length) { endTutorial(); return; }
  const [t, body] = TUTORIAL_STEPS[i];
  mc.innerHTML = `<h2>${esc(t)}</h2><div class="menu-tagline">Tutorial ${i + 1} of ${TUTORIAL_STEPS.length}</div><p class="tut-step">${esc(body)}</p>
    <div class="modal-actions"><button class="action-btn primary" onclick="showTutorial(${i + 1})">${i + 1 === TUTORIAL_STEPS.length ? "Start" : "Next"}</button><button class="action-btn" onclick="endTutorial()">Skip</button></div>`;
  openModal(false);
}
function endTutorial() {
  try { localStorage.setItem(TUTORIAL_KEY, "1"); } catch (e) {}
  closeModal();
  advance();
}

/* ============================================================
   INIT & DEBUG HOOKS
   ============================================================ */
function init() {
  setupInput();
  try { if (localStorage.getItem("pumatriage_muted_v1") === "1") { UI.muted = true; document.getElementById("mute-btn").setAttribute("aria-pressed", "true"); } } catch (e) {}
  try { const sp = parseInt(localStorage.getItem("pumatriage_speed_v1") || "1", 10); if (sp >= 1 && sp <= 3) { UI.speed = sp; const b = document.getElementById("speed-btn"); if (b) b.textContent = SPEED_LABEL[sp]; } } catch (e) {}
  document.getElementById("board").innerHTML = '<h3>Your SOC</h3><div class="hint">No active shift.</div>';
  const shot = /[#&]shot=([a-z]+)/.exec(location.hash);
  if (shot) { screenshotState(shot[1]); return; }
  showMainMenu();
}
// #shot=setup|midgame|gameover|solo — deterministic states for README screenshots (headless Chromium).
function screenshotState(which) {
  UI.reducedMotion = true;
  houseRules = { ...DIFFICULTY_PRESETS[which === "solo" ? "solo" : "normal"].sliders };
  try { localStorage.setItem(TUTORIAL_KEY, "1"); } catch (e) {}
  newGame(7);
  const stopAt = (ph, st) => { let guard = 0; while (!(G.phase === ph && G.step === st) && !G.gameOver && guard++ < 400) { botAnswerWait(); advance(); } };
  if (which === "setup") { showMainMenu(); return; }
  if (which === "midgame" || which === "solo") {
    advance();
    stopAt("activate", "human");
    for (let i = 0; i < 3 && G.round < 4; i++) { botAnswerWait(); advance(); stopAt("activate", "human"); }
    const p = human();
    const m = p.meeples.find(x => !x.used && !x.off);
    const t = p.departments.find(d => canActivate(d, p));
    if (m && t) { onMeepleClick(m.uid); onDeptClick(t.uid); }
  } else if (which === "gameover") { advance(); stopAt("gameover", "done"); }
  UI.reducedMotion = false;
  updateAll();
  console.log("%cPumaTriage", "color:#ffb000;font-size:16px;letter-spacing:3px");
  console.log("%cReading the source? Good instinct. __PT.runSim(50) plays bot-vs-bot games headlessly.", "color:#00ff41");
}
window.__PT = {
  get G() { return G; }, UI, newGame, advance, commit, legalSets, canActivate, matchesSel, boardDice, human,
  setSeed(n) { if (G) G.rng = n >>> 0; },
  autoHuman(on) { UI.autoHuman = !!on; if (on && G && !G.gameOver) advance(); },
  runSim(n = 20, hr = null, seed = 1) {
    const savedG = G, savedRules = houseRules, savedUI = { headless: UI.headless, autoHuman: UI.autoHuman };
    if (hr) houseRules = { ...houseRules, ...hr };
    UI.headless = true; UI.autoHuman = true;
    const out = { games: 0, avgScore: 0, avgFatalities: 0, avgDischarges: 0, winsByIndex: {}, crashes: [], min: Infinity, max: -Infinity };
    for (let s = seed; s < seed + n; s++) {
      try {
        newGame(s); human().skill = houseRules.rivalSkill; advance();
        const h = human();
        out.games++; out.avgScore += h.total; out.avgFatalities += h.fatalities; out.avgDischarges += h.dischargedTotal;
        out.min = Math.min(out.min, h.total); out.max = Math.max(out.max, h.total);
        for (const id of G.final.winners) out.winsByIndex[id] = (out.winsByIndex[id] || 0) + 1;
      } catch (e) { out.crashes.push({ seed: s, error: e.message }); }
    }
    if (out.games) { out.avgScore /= out.games; out.avgFatalities /= out.games; out.avgDischarges /= out.games; }
    G = savedG; houseRules = savedRules; UI.headless = savedUI.headless; UI.autoHuman = savedUI.autoHuman;
    return out;
  },
  assertInvariants,
};
document.addEventListener("DOMContentLoaded", init);
</script>
