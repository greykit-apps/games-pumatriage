        <tr><td>Incident Events</td><td>From shift 2, an event card each shift. These are PumaTriage originals.</td></tr>
        <tr><td>Inherited Mess</td><td>Start with five hosts at 3, 3, 4, 5, 5.</td></tr>
        <tr><td>Worm Outbreak</td><td>Every intake, each SOC also draws and rolls one extra host straight into quarantine.</td></tr>
        <tr><td>Persistent Threat</td><td>Dwell time degrades queued hosts by 2.</td></tr>
        <tr><td>MSSP Handover</td><td>After shift 8, outside providers show colour-and-value slots. Hand matching hosts over for +1 each; every host left costs 1.</td></tr>
        <tr><td>Solo penalties</td><td>Double the breach penalty and/or the incomplete-report penalty.</td></tr>
      </table>
      <h4>Incident Events</h4>
      <table class="help-table">${eventRows}</table>
    </div>
    <div ${panel("keys")}>
      <ul>
        <li><b>1–9</b> — select an analyst or specialist</li>
        <li><b>Enter</b> — confirm the highlighted action</li>
        <li><b>Escape</b> — cancel the current selection / close a dialog</li>
        <li><b>U</b> — undo the last placement (not past a re-roll)</li>
        <li><b>E</b> — end activation</li>
        <li><b>B</b> — spend an intel token to heal</li>
        <li><b>H</b> or <b>?</b> — this help</li>
        <li><b>M</b> — toggle sound</li>
        <li><b>Double-click a host</b> — confirm the current selection (a slow second click deselects it instead)</li>
        <li><b>Tab</b> — every host, tool and analyst is reachable by keyboard</li>
      </ul>
    </div>
    <div ${panel("about")}>
      <div style="text-align:center;padding:40px 20px;">
        <p style="font-size:14px;color:var(--amber);margin-bottom:16px;">PumaTriage</p>
        <p style="font-size:12px;margin-bottom:8px;">Incident Response Dice Game</p>
        <p style="margin-bottom:24px;">Built by <a href="https://www.greykit.com" target="_blank" rel="noopener">greykit.com</a></p>
        <p style="font-size:10px;color:var(--text-dim);">Inspired by Dice Hospital by Stanislav Kordonskiy and Mike Nudd / Alley Cat Games.<br>A one-for-one port of the base rules, re-themed for the SOC. Everything beyond the base game is an opt-in house rule.</p>
      </div>
    </div>
    <div class="modal-actions"><button class="action-btn" onclick="${closeAction}">${G ? "Close" : "Back"}</button></div>`;
  openModal(true);
}
function gradeFor(total) { return total >= 60 ? "S" : total >= 45 ? "A" : total >= 30 ? "B" : total >= 15 ? "C" : "F"; }
function showGameOver() {
  if (!G || !G.final) return;
  const mc = document.getElementById("modal-content");
  const won = G.final.winners.includes(0);
  let html;
  if (G.cfg.solo) {
    const p = human(), b = p.breakdown;
    sfx(b.total >= 30 ? "win" : "lose");
    html = `<h2>Shift 8 closed</h2><div class="grade">${gradeFor(b.total)}</div><div class="menu-tagline">${esc(pick(FLAVOR.solo))}</div>
      <table class="score-table">
        <tr><td>Restorations and filed reports</td><td>${b.base}</td></tr>
        <tr><td>Breaches (${p.fatalities})</td><td>${b.fatalities}</td></tr>
        <tr><td>Intel tokens (${p.bloodBags})</td><td>+${b.bloodBags}</td></tr>
        <tr><td>Unfiled reports (${b.incompleteReports})</td><td>${b.reports}</td></tr>
        <tr><td class="tot">Final reputation</td><td class="tot">${b.total}</td></tr>
      </table>
      <p style="text-align:center">${p.dischargedTotal} hosts restored over 8 shifts.</p>`;
  } else {
    sfx(won ? "win" : "lose");
    html = `<h2>${won ? (G.final.winners.length > 1 ? "Shared win" : "Your SOC wins") : "Out-triaged"}</h2><div class="menu-tagline">${esc(pick(won ? FLAVOR.win : FLAVOR.lose))}</div>
      <table class="help-table"><tr><th>#</th><th>SOC</th><th>Reputation</th><th>Breaches</th><th>Intel</th><th>Restored</th>${G.cfg.collections ? "<th>Handover</th>" : ""}<th>Total</th></tr>`;
    G.final.ranking.forEach((id, i) => {
      const p = G.players[id], b = p.breakdown;
      html += `<tr style="${id === 0 ? "color:var(--amber)" : ""}"><td>${i + 1}</td><td>${esc(p.name)}</td><td>${b.base}</td><td>${b.fatalities}</td><td>+${b.bloodBags}</td><td>${p.dischargedTotal}</td>${G.cfg.collections ? `<td>${b.collections + b.leftover}</td>` : ""}<td><b>${b.total}</b></td></tr>`;
    });
    html += `</table><p class="hint">Ties break on fewer hosts left, then higher total integrity.</p>`;
  }
  mc.innerHTML = html + `<div class="modal-actions"><button class="action-btn primary" onclick="showMainMenu()">New game</button><button class="action-btn" onclick="closeModal()">Look at the board</button></div>`;
  openModal(true);
}

/* ============================================================
   TUTORIAL
   ============================================================ */
const TUTORIAL_STEPS = [
  ["Welcome, Commander", "Compromised hosts arrive as dice. The face is integrity: 1 is nearly lost, 6 is nearly clean. Push a host past 6 and it is restored to production for reputation."],
  ["Quarantine", "Your four segments hold three hosts each. New hosts land in the upper Queued slot. Anything still Queued at the end of a shift degrades by 1, and a 1 that degrades is a breach."],
  ["Tools and staff", "During Activation, click an analyst, then a tool, then the glowing hosts it can work on. Double-click a host to confirm; a slow second click deselects it instead. The host moves to its Worked slot and is safe from dwell time this shift."],
  ["Colours", "Red, yellow and green are just colours. Some tools and specialists only work on one colour. An intel token can retag a host for a shift when you need a match."],
  ["Improve", "Each shift you take one improvement: a tool gives you more ways to heal, a specialist gives you an extra pair of hands with a follow-up ability."],
  ["Escalation queues", "Lower-numbered queues carry sicker hosts, but their owner improves first, and the lowest taken earns an intel token and the Commander role. Don't take more than you can house."],
  ["Score", "Restoring several hosts in the same shift scores more per host. Plan a big Restoration rather than trickling. Eight shifts. Good luck."],
];
function tutorialSeen() { try { return localStorage.getItem(TUTORIAL_KEY) === "1"; } catch (e) { return false; } }
function showTutorial(i) {
  const mc = document.getElementById("modal-content");
  if (i >= TUTORIAL_STEPS.length) { endTutorial(); return; }
  const [t, body] = TUTORIAL_STEPS[i];
  mc.innerHTML = `<h2>${esc(t)}</h2><div class="menu-tagline">Tutorial ${i + 1} of ${TUTORIAL_STEPS.length}</div><p class="tut-step">${esc(body)}</p>
    <div class="modal-actions"><button class="action-btn primary" onclick="showTutorial(${i + 1})">${i + 1 === TUTORIAL_STEPS.length ? "Start" : "Next"}</button><button class="action-btn" onclick="endTutorial()">Skip</button></div>`;
  openModal(false);
}
function endTutorial() {
  try { localStorage.setItem(TUTORIAL_KEY, "1"); } catch (e) {}
  closeModal();
  advance();
}

/* ============================================================
   INIT & DEBUG HOOKS
   ============================================================ */
function init() {
  setupInput();
  try { if (localStorage.getItem("pumatriage_muted_v1") === "1") { UI.muted = true; document.getElementById("mute-btn").setAttribute("aria-pressed", "true"); } } catch (e) {}
  document.getElementById("board").innerHTML = '<h3>Your SOC</h3><div class="hint">No active shift.</div>';
  document.getElementById("center").innerHTML = '<div class="center-title">Table</div><div class="hint">Start a game from the menu.</div>';
  const shot = /[#&]shot=([a-z]+)/.exec(location.hash);
  if (shot) { screenshotState(shot[1]); return; }
  showMainMenu();
}
// #shot=setup|midgame|gameover|solo — deterministic states for README screenshots (headless Chromium).
function screenshotState(which) {
  UI.reducedMotion = true;
  houseRules = { ...DIFFICULTY_PRESETS[which === "solo" ? "solo" : "normal"].sliders };
  try { localStorage.setItem(TUTORIAL_KEY, "1"); } catch (e) {}
  newGame(7);
  const stopAt = (ph, st) => { let guard = 0; while (!(G.phase === ph && G.step === st) && !G.gameOver && guard++ < 400) { botAnswerWait(); advance(); } };
  if (which === "setup") { showMainMenu(); return; }
  if (which === "midgame" || which === "solo") {
    advance();
    stopAt("activate", "human");
    for (let i = 0; i < 3 && G.round < 4; i++) { botAnswerWait(); advance(); stopAt("activate", "human"); }
    const p = human();
    const m = p.meeples.find(x => !x.used && !x.off);
    const t = p.departments.find(d => canActivate(d, p));
    if (m && t) { onMeepleClick(m.uid); onDeptClick(t.uid); }
  } else if (which === "gameover") { advance(); stopAt("gameover", "done"); }
  UI.reducedMotion = false;
  updateAll();
  console.log("%cPumaTriage", "color:#ffb000;font-size:16px;letter-spacing:3px");
  console.log("%cReading the source? Good instinct. __PT.runSim(50) plays bot-vs-bot games headlessly.", "color:#00ff41");
}
window.__PT = {
  get G() { return G; }, UI, newGame, advance, commit, legalSets, canActivate, matchesSel, boardDice, human,
  setSeed(n) { if (G) G.rng = n >>> 0; },
  autoHuman(on) { UI.autoHuman = !!on; if (on && G && !G.gameOver) advance(); },
  runSim(n = 20, hr = null, seed = 1) {
    const savedG = G, savedRules = houseRules, savedUI = { headless: UI.headless, autoHuman: UI.autoHuman };
    if (hr) houseRules = { ...houseRules, ...hr };
    UI.headless = true; UI.autoHuman = true;
    const out = { games: 0, avgScore: 0, avgFatalities: 0, avgDischarges: 0, winsByIndex: {}, crashes: [], min: Infinity, max: -Infinity };
    for (let s = seed; s < seed + n; s++) {
      try {
        newGame(s); human().skill = houseRules.rivalSkill; advance();
        const h = human();
        out.games++; out.avgScore += h.total; out.avgFatalities += h.fatalities; out.avgDischarges += h.dischargedTotal;
        out.min = Math.min(out.min, h.total); out.max = Math.max(out.max, h.total);
        for (const id of G.final.winners) out.winsByIndex[id] = (out.winsByIndex[id] || 0) + 1;
      } catch (e) { out.crashes.push({ seed: s, error: e.message }); }
    }
    if (out.games) { out.avgScore /= out.games; out.avgFatalities /= out.games; out.avgDischarges /= out.games; }
    G = savedG; houseRules = savedRules; UI.headless = savedUI.headless; UI.autoHuman = savedUI.autoHuman;
    return out;
  },
  assertInvariants,
};
document.addEventListener("DOMContentLoaded", init);
</script>
